[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "collaborative-taskmaster-studio"
version = "0.1.0"
description = "Collaborative Partner for designing auditable Taskmaster agents."
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = { text = "Apache-2.0" }
authors = [{ name = "Collaborative Taskmaster Studio Team" }]
dependencies = [
  "cryptography>=45,<51",
  "fastapi>=0.115,<1",
  "google-auth>=2.40,<3",
  "jsonschema[format]>=4.23,<5",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "pypdf>=5,<7",
  "starlette>=0.46,<2",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
vertex = [
  "google-adk>=2.7,<3",
  "google-genai>=2.12.1,<3",
  "truststore>=0.10,<1",
]
firestore = [
  "google-cloud-firestore>=2.28,<3",
]
storage = [
  "google-cloud-storage>=3.4,<4",
]
cloud = [
  "google-cloud-firestore>=2.28,<3",
  "google-cloud-storage>=3.4,<4",
]
laboratory = [
  "pytest>=8.3,<9",
]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
  "types-jsonschema>=4.23,<5",
]

[project.scripts]
taskmaster-studio = "app.main:run"

[tool.hatch.build.targets.wheel]
packages = ["app", "studio", "agents", "infrastructure", "adapters", "sandbox"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unused_configs = true
